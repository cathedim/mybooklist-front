<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>mybooklist</title>
        
        <link rel="icon" type="image/gif/png" href="img/book-navbar.png">        
        <link rel="stylesheet" href="styles/style.css">
    </head>

    <body>
        <header id="navbar">
            <img id="img-navbar" src="img/book-navbar.png" onClick="window.location.reload()">
            <h1 id="titulo-navbar">mybooklist</h1>
            <div id="busca">
                <input id="texto-busca" placeholder="Busque por um livro"></input>
                <img class="icon-busca" src="img/search.png" onClick="buscarLivro()">
                <img class="icon-busca" src="img/adv-search.png" onClick="mostraBuscaAvancada()">
            </div>
        </header>

        <main>
            <div id="div-inicial">
                <h3>Livros</h3>
                <img id="btn-mostrar" onClick="mostraAdicionarLivro()" src="img/add.png">
            </div>
            <div id="div-adicionar">
                <h4>Adicionar novo livro</h4>
                <form id="formularioAdicionar">
                    <label for="nome">Nome</label>
                    <br><input type="text" id="nome" name="nome">
                    <br><br><label for="autor">Autor</label>
                    <br><input type="text" id="autor" name="autor">
                    <br><br><label for="ano_publicacao">Ano de publicação</label>
                    <br><input type="text" id="ano_publicacao" name="ano_publicacao">
                    <br><br><label for="capa">Capa</label>
                    <div id="ajuda">
                        <img id="icon-ajuda" src="img/help.png">
                        <p id="texto-ajuda">Endereço da imagem (.png, .jpg ou .jpeg)</p>
                    </div>
                    <br><input type="text" id="capa" name="capa"><br><br>
                    <input type="submit" class="btn-formulario" value="Adicionar">
                </form> 
            </div>
            <div id="div-busca-avancada">
                <h4>Busca avançada</h4>
                <form id="formularioBuscaAvancada">
                    <input type="text" id="busca-avancada" name="busca"><br><br>
                    <input type="radio" id="nome-busca" name="tipo-busca" value="Nome" checked>
                    <label for="nome-busca">Nome</label>
                    <input type="radio" id="autor-busca" name="tipo-busca" value="Autor">
                    <label for="autor-busca">Autor</label>
                    <input type="radio" id="geral-busca" name="tipo-busca" value="Geral">
                    <label for="geral-busca">Geral</label>
                    <br><input type="submit" class="btn-formulario" value="Buscar">
                </form> 
            </div>

            <ul id="livros"></ul>

            <div id="paginacao">
                <button class="btn-paginacao" id="prev"><img src="img/prev.png"></button>
                <input type="number" id="page-number" />
                <button class="btn-paginacao" id="next"><img src="img/next.png"></button>
            </div>
        </main>
    
        <script src="scripts.js"></script>
    </body>
</html>
